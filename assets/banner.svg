<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="300" viewBox="0 0 1200 300" role="img" aria-labelledby="t d">
  <title id="t">Adarsh Kushwaha, Frontend Engineer</title>
  <desc id="d">Animated gradient banner: Adarsh Kushwaha, Frontend Engineer, SDE II. React, Next.js, TypeScript, microfrontends and web performance.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0d1117"/>
      <stop offset="1" stop-color="#1a1b27"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#22d3ee">
        <animate attributeName="stop-color" values="#22d3ee;#a78bfa;#f472b6;#22d3ee" dur="8s" repeatCount="indefinite"/>
      </stop>
      <stop offset="0.5" stop-color="#a78bfa">
        <animate attributeName="stop-color" values="#a78bfa;#f472b6;#22d3ee;#a78bfa" dur="8s" repeatCount="indefinite"/>
      </stop>
      <stop offset="1" stop-color="#f472b6">
        <animate attributeName="stop-color" values="#f472b6;#22d3ee;#a78bfa;#f472b6" dur="8s" repeatCount="indefinite"/>
      </stop>
    </linearGradient>
    <radialGradient id="glowA" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#7c3aed" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#7c3aed" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowB" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#06b6d4" stop-opacity="0.45"/>
      <stop offset="1" stop-color="#06b6d4" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#ffffff" stroke-opacity="0.04"/>
    </pattern>
    <clipPath id="round"><rect width="1200" height="300" rx="20"/></clipPath>
  </defs>

  <g clip-path="url(#round)">
    <rect width="1200" height="300" fill="url(#bg)"/>
    <rect width="1200" height="300" fill="url(#grid)"/>

    <circle cx="180" cy="60" r="220" fill="url(#glowA)">
      <animate attributeName="cx" values="180;260;180" dur="12s" repeatCount="indefinite"/>
    </circle>
    <circle cx="1040" cy="250" r="240" fill="url(#glowB)">
      <animate attributeName="cy" values="250;200;250" dur="10s" repeatCount="indefinite"/>
    </circle>

    <!-- code-bracket motif -->
    <g fill="none" stroke="url(#accent)" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" opacity="0.9">
      <path d="M1010 92 L975 128 L1010 164"/>
      <path d="M1100 92 L1135 128 L1100 164"/>
      <path d="M1070 84 L1040 172">
        <animate attributeName="opacity" values="1;0.25;1" dur="2.4s" repeatCount="indefinite"/>
      </path>
    </g>

    <text x="80" y="128" fill="#e6edf3" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="58" font-weight="800" letter-spacing="-1">Adarsh Kushwaha</text>
    <rect x="82" y="150" width="140" height="5" rx="2.5" fill="url(#accent)">
      <animate attributeName="width" values="0;140;140" keyTimes="0;0.3;1" dur="3s" fill="freeze"/>
    </rect>
    <text x="80" y="200" fill="url(#accent)" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="28" font-weight="700">Frontend Engineer · SDE II</text>
    <text x="80" y="240" fill="#8b949e" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="18">React · Next.js · TypeScript · Microfrontends · Web Performance</text>
  </g>
</svg>
